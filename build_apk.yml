name: Construire l'APK FASTCUT

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse de la PWA (ex. https://moncompte.github.io/fastcut/)"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Installer le SDK Android
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o t.zip
          unzip -q t.zip && mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Générer la clé de signature
        run: |
          keytool -genkeypair -v -keystore signature.keystore \
            -alias fastcut -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass fastcut2026 -keypass fastcut2026 \
            -dname "CN=Abdelhak AITADDI, O=FASTCUT, C=MA"

      - name: Construire l'APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          JAVA_HOME: /opt/hostedtoolcache/Java_temurin_jdk/17.0.0/x64
        run: |
          cat > bubblewrap.json << JSON
          {
            "packageId": "ma.aitaddi.fastcut",
            "host": "$(echo '${{ inputs.url }}' | sed -E 's#https?://([^/]+).*#\1#')",
            "name": "FASTCUT",
            "launcherName": "FASTCUT",
            "display": "standalone",
            "themeColor": "#13263d",
            "backgroundColor": "#0d1826",
            "startUrl": "$(echo '${{ inputs.url }}' | sed -E 's#https?://[^/]+##')",
            "iconUrl": "${{ inputs.url }}icone-512.png",
            "appVersionName": "2.0",
            "appVersionCode": 2,
            "signingKey": { "path": "./signature.keystore", "alias": "fastcut" },
            "orientation": "any",
            "fallbackType": "customtabs",
            "enableNotifications": false,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ inputs.url }}manifest.json",
            "fullScopeUrl": "${{ inputs.url }}",
            "minSdkVersion": 21,
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "auto",
            "androidSdkPath": "/home/runner/android-sdk"
          }
          JSON
          echo "fastcut2026" | bubblewrap build --skipPwaValidation

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: fastcut-apk
          path: |
            *.apk
            *.aab
            signature.keystore
