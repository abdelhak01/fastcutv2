<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13263d">
<title>FASTCUT — Dessin de gabarits</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<style>
:root{
  --bleu:#2563c9; --bleu-fonce:#13263d; --bleu-clair:#5a9fe0;
  --orange:#c98a3a; --vert:#2b9e6b; --rouge:#d94a4a;
  --cote:#3f8f70; --diag:#b5762a;
  --r:8px;
  --fond:#0d1826; --panneau:#0f1d2e; --carte:#16232f; --bord:#253546;
  --texte:#dae4ee; --texte2:#7d94ad; --champ:#16232f;
  --dessin:#f2f6fa; --dessin-trait:#2563c9; --dessin-texte:#3d4b57;
}
[data-theme="clair"]{
  --fond:#eef2f6; --panneau:#ffffff; --carte:#f4f7fa; --bord:#dde5ed;
  --texte:#25313d; --texte2:#63768a; --champ:#ffffff;
  --dessin:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{height:100%}
body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--fond);color:var(--texte);
  font-size:15px;display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit}

/* ---------- Barre ---------- */
.barre{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bleu-fonce);flex-shrink:0;
}
.logo{width:30px;height:30px;border-radius:7px;background:var(--bleu);
  display:grid;place-items:center;flex-shrink:0}
.marque{font-size:17px;font-weight:600;letter-spacing:.02em;color:#fff}
.sous-marque{font-size:12px;color:#8fa8c2}
.barre nav{margin-left:auto;display:flex;gap:4px}
.barre nav button{padding:7px 12px;border-radius:6px;font-size:13px;color:#b3c6da}
.barre nav button.actif{background:rgba(255,255,255,.12);color:#fff}

/* ---------- Disposition ---------- */
.ecran{flex:1;display:flex;gap:1px;background:var(--fond);overflow:hidden;min-height:0}
.colonne{background:var(--panneau);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.col-formes{flex:0 0 148px}
.col-centre{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-saisie{flex:0 0 214px}

.titre-section{font-size:11px;color:var(--texte2);margin:0 0 8px;font-weight:500}
.titre-section.cote{color:var(--cote)}
.titre-section.diag{color:var(--diag)}

/* ---------- Formes ---------- */
.forme{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);
  width:100%;text-align:left;margin-bottom:4px;transition:background .12s}
.forme:hover{background:var(--carte)}
.forme.actif{background:var(--bleu)}
.forme.actif span{color:#fff;font-weight:500}
.forme svg{flex-shrink:0}
.forme span{font-size:13px;color:var(--texte)}

/* ---------- Onglets dessin ---------- */
.onglets{display:flex;gap:2px;flex-shrink:0}
.onglets button{padding:7px 13px;font-size:13px;color:var(--texte2);
  border-bottom:2px solid transparent}
.onglets button.actif{color:var(--texte);border-bottom-color:var(--bleu)}

.zone-dessin{flex:1;background:var(--dessin);border-radius:var(--r);
  position:relative;min-height:200px;overflow:hidden}
.zone-dessin svg{width:100%;height:100%;display:block}
.echelle{position:absolute;right:9px;bottom:8px;font-size:11px;color:#68798d;
  background:rgba(255,255,255,.85);padding:3px 8px;border-radius:5px}

/* ---------- Bandeau d'etat ---------- */
.etat{display:flex;align-items:center;gap:10px;background:var(--carte);
  border-radius:var(--r);padding:10px 12px;flex-shrink:0}
.pastille{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;color:#fff;flex-shrink:0}
.etat-titre{font-size:13px;display:block}
.etat-detail{font-size:11px;color:var(--texte2);line-height:1.5}
.mini-bouton{font-size:11px;padding:6px 11px;border-radius:6px;
  background:var(--panneau);border:1px solid var(--bord);color:var(--texte);
  flex-shrink:0;align-self:center}

/* ---------- Champs ---------- */
.libelle{font-size:11px;color:var(--texte2);margin:0 0 4px}
.champ{width:100%;background:var(--champ);border:1px solid var(--bord);
  border-radius:6px;padding:8px 10px;font-size:14px;color:var(--texte);
  margin-bottom:8px}
.champ:focus{outline:none;border-color:var(--bleu)}
.champ::placeholder{color:var(--texte2)}

.ligne-mesure{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ligne-mesure label{font-size:11px;width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ligne-mesure label.c{color:var(--cote)}
.ligne-mesure label.d{color:var(--diag)}
.ligne-mesure input{flex:1;min-width:0;background:var(--champ);
  border:1px solid var(--bord);border-radius:6px;padding:7px 9px;
  font-size:14px;color:var(--texte);text-align:right;
  font-variant-numeric:tabular-nums}
.ligne-mesure input.d{border-color:#3d3020}
.ligne-mesure input:focus{outline:none;border-color:var(--bleu)}

.option{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.option input[type=checkbox]{width:17px;height:17px;accent-color:var(--bleu);margin:0}
.option span{font-size:13px;flex:1}
.option input[type=number]{width:62px;background:var(--champ);
  border:1px solid var(--bord);border-radius:5px;padding:5px 7px;
  font-size:13px;color:var(--texte);text-align:right}

.bouton{display:block;width:100%;border-radius:var(--r);padding:11px;
  font-size:14px;font-weight:500;text-align:center;color:#fff;margin-top:8px}
.b-orange{background:var(--orange)}
.b-bleu{background:var(--bleu)}
.b-neutre{background:var(--carte);color:var(--texte);border:1px solid var(--bord)}
.bouton:active{filter:brightness(.92)}
.bouton:disabled{opacity:.45}

/* ---------- Commande ---------- */
.panneau-item{background:var(--carte);border-radius:6px;padding:8px 10px;margin-bottom:5px}
.panneau-ref{font-size:13px;display:block;margin-bottom:2px}
.panneau-dim{font-size:11px;color:var(--texte2)}
.panneau-actions{display:flex;gap:5px;margin-top:6px}
.panneau-actions button{flex:1;font-size:11px;padding:5px;border-radius:5px;
  background:var(--panneau);border:1px solid var(--bord)}

/* ---------- Choix de forme (ambiguite) ---------- */
.choix-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-top:10px}
.choix-carte{background:var(--dessin);border:2px solid var(--bord);border-radius:var(--r);
  padding:6px;cursor:pointer}
.choix-carte.actif{border-color:var(--bleu)}
.choix-carte svg{width:100%;height:110px;display:block}
.choix-carte p{margin:5px 0 0;font-size:11px;color:var(--dessin-texte);text-align:center}

/* ---------- Pages secondaires ---------- */
.page{flex:1;overflow-y:auto;padding:18px}
.page-large{max-width:620px;margin:0 auto}
.projet-ligne{display:flex;align-items:center;gap:12px;background:var(--panneau);
  border:1px solid var(--bord);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.projet-ligne h3{margin:0 0 3px;font-size:15px;font-weight:500}
.projet-ligne p{margin:0;font-size:12px;color:var(--texte2)}
.projet-ligne button{margin-left:auto;background:var(--bleu);color:#fff;
  padding:8px 14px;border-radius:6px;font-size:13px}
.reglage{background:var(--panneau);border:1px solid var(--bord);
  border-radius:var(--r);padding:14px;margin-bottom:10px}
.reglage h3{margin:0 0 3px;font-size:15px;font-weight:500}
.reglage p{margin:0;font-size:12px;color:var(--texte2)}
.segments{display:flex;gap:5px;margin-top:10px}
.segments button{flex:1;padding:9px 0;border-radius:6px;font-size:13px;
  background:var(--carte);border:1px solid var(--bord)}
.segments button.actif{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.interrupteur{margin-left:auto;width:44px;height:25px;border-radius:13px;
  background:var(--bord);position:relative;transition:background .15s;flex-shrink:0}
.interrupteur.on{background:var(--bleu)}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;
  border-radius:50%;background:#fff;transition:transform .15s}
.interrupteur.on::after{transform:translateX(19px)}

.vide{text-align:center;color:var(--texte2);padding:40px 20px}
.vide p{margin:6px 0;font-size:14px}

/* ---------- Modale ---------- */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;
  padding:16px;z-index:50}
.modale{background:var(--panneau);border-radius:12px;padding:20px;
  max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modale h2{margin:0 0 8px;font-size:17px;font-weight:600}
.modale p{margin:0 0 14px;font-size:14px;color:var(--texte2);line-height:1.55}
.modale-actions{display:flex;gap:8px;margin-top:14px}
.modale-actions .bouton{margin-top:0}

@media (max-width:820px){
  body{overflow:auto;-webkit-overflow-scrolling:touch}
  .ecran{flex-direction:column;overflow:visible;min-height:0;height:auto}
  .colonne{overflow:visible;height:auto}
  .col-formes,.col-centre,.col-saisie{flex:none;min-height:0}
  .page{overflow:visible;height:auto}
  .col-formes{display:flex;gap:5px;overflow-x:auto;padding:9px}
  .col-formes .titre-section{display:none}
  .forme{flex-direction:column;gap:3px;width:auto;flex-shrink:0;padding:8px 11px}
  .forme span{font-size:11px;white-space:nowrap}
  .zone-dessin{min-height:220px}
  .barre nav button{padding:7px 9px;font-size:12px}
  .sous-marque{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import {
  calculerFormes, parametresPourForme, diagonalesRequises,
  appliquerArrondis, offsetRectiligne, rectangleMarge, bbox, dist,
  mesureDeControle, retournerForme, SILHOUETTES
} from './moteur.js';
import { construireDXF, telechargerDXF } from './dxf.js';
import { ouvrirFicheDecoupe, construireCSV, telechargerTexte,
  exporterSauvegarde, lireSauvegarde } from './exports.js';

// =====================================================================
// Etat
// =====================================================================
const S = {
  page: 'accueil',
  nCotes: 4,
  valeurs: {},
  arrondis: [],
  marge: { actif: true, valeur: 40 },
  rectiligne: { actif: false, valeur: 3 },
  projet: '',
  reference: '',
  epaisseur: '',
  note: '',
  photo: null,
  modifieIndex: null,
  commande: [],
  resultat: { etat: 'incomplet', formes: [] },
  choixForme: 0,
  ongletDessin: 'apercu',
  controle: null,
  theme: localStorage.getItem('fc_theme') || 'sombre',
  taille: parseFloat(localStorage.getItem('fc_taille')) || 1,
};

const stockage = {
  lire(cle, defaut) {
    try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; }
    catch { return defaut; }
  },
  ecrire(cle, valeur) {
    try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch {}
  }
};

// Restaurer le travail en cours
const brouillon = stockage.lire('fc_brouillon', null);
if (brouillon) {
  S.projet = brouillon.projet || '';
  S.commande = brouillon.commande || [];
}

function sauverBrouillon() {
  stockage.ecrire('fc_brouillon', { projet: S.projet, commande: S.commande });
}

// =====================================================================
// Geometrie du panneau courant
// =====================================================================
function contourCourant(source) {
  const src = source || S;
  let pts = src.pointsBruts;
  if (!pts) return null;
  if (src.arrondis?.length) pts = appliquerArrondis(pts, src.arrondis);
  if (src.rectiligne?.actif) pts = offsetRectiligne(pts, src.rectiligne.valeur);
  const rect = src.marge?.actif ? rectangleMarge(pts, src.marge.valeur) : null;
  return { contour: pts, rect };
}

function recalculer() {
  S.resultat = calculerFormes(S.nCotes, S.valeurs);
  if (S.choixForme >= S.resultat.formes.length) S.choixForme = 0;
  S.pointsBruts = S.resultat.formes[S.choixForme]?.points || null;
}

function dimensionsPanneau(g) {
  const b = bbox(g.rect || g.contour);
  return { w: Math.round(b.maxX - b.minX), h: Math.round(b.maxY - b.minY) };
}

// =====================================================================
// Dessin SVG
// =====================================================================
function svgForme(points, rect, options = {}) {
  if (!points || points.length < 3) return '';
  const tous = rect ? [...points, ...rect] : points;
  const b = bbox(tous);
  const w = Math.max(b.maxX - b.minX, 1), h = Math.max(b.maxY - b.minY, 1);
  const pad = Math.max(w, h) * 0.1;
  const vb = `${b.minX - pad} ${-b.maxY - pad} ${w + pad * 2} ${h + pad * 2}`;
  const d = (p) => p.map(([x, y]) => `${x.toFixed(1)},${(-y).toFixed(1)}`).join(' ');
  const ep = Math.max(w, h) / 260;

  let s = `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">`;
  if (rect) s += `<polygon points="${d(rect)}" fill="none" stroke="#c98a3a"
      stroke-width="${ep}" stroke-dasharray="${ep * 5} ${ep * 4}"/>`;
  s += `<polygon points="${d(points)}" fill="#bcd9f0" fill-opacity="0.5"
      stroke="#2563c9" stroke-width="${ep * 1.9}"/>`;

  if (options.cotes) {
    const n = points.length;
    const police = Math.max(w, h) / 32;
    for (let i = 0; i < n; i++) {
      const a = points[i], c = points[(i + 1) % n];
      const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
      const cx = points.reduce((s2, p) => s2 + p[0], 0) / n;
      const cy = points.reduce((s2, p) => s2 + p[1], 0) / n;
      const dx = mx - cx, dy = my - cy;
      const nrm = Math.hypot(dx, dy) || 1;
      const lx = mx + (dx / nrm) * police * 1.4;
      const ly = my + (dy / nrm) * police * 1.4;
      s += `<text x="${lx.toFixed(1)}" y="${(-ly).toFixed(1)}" font-size="${police}"
          fill="#3d4b57" text-anchor="middle" dominant-baseline="middle"
          >${Math.round(dist(a, c))}</text>`;
    }
    s += `<circle cx="${points[0][0].toFixed(1)}" cy="${(-points[0][1]).toFixed(1)}"
        r="${ep * 3.4}" fill="#d94a4a"/>`;
  }
  return s + '</svg>';
}

function svgCroquis(n) {
  // Silhouette realiste (proche d'un vrai gabarit), pas un polygone regulier
  const brut = SILHOUETTES[n];
  const M = 34;                       // marge autour, pour les etiquettes
  const V = brut.map(([x, y]) => [M + x * 1.9, M + (100 - y) * 1.5]);
  const cx = V.reduce((s, p) => s + p[0], 0) / n;
  const cy = V.reduce((s, p) => s + p[1], 0) / n;
  const d = V.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  let s = `<svg viewBox="0 0 258 218" preserveAspectRatio="xMidYMid meet">`;
  s += `<polygon points="${d}" fill="#bcd9f0" fill-opacity="0.35" stroke="#2563c9" stroke-width="2"/>`;

  diagonalesRequises(n).forEach(([a, b2], i) => {
    s += `<line x1="${V[a][0].toFixed(1)}" y1="${V[a][1].toFixed(1)}"
        x2="${V[b2][0].toFixed(1)}" y2="${V[b2][1].toFixed(1)}"
        stroke="#c98a3a" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    const mx = (V[a][0] + V[b2][0]) / 2, my = (V[a][1] + V[b2][1]) / 2;
    s += `<rect x="${mx - 12}" y="${my - 9}" width="24" height="17" rx="4" fill="#f2f6fa"/>`;
    s += `<text x="${mx}" y="${my}" font-size="11" fill="#b5762a" text-anchor="middle"
        dominant-baseline="central" font-weight="700">d${i + 1}</text>`;
  });

  for (let i = 0; i < n; i++) {
    const a = V[i], b2 = V[(i + 1) % n];
    const mx = (a[0] + b2[0]) / 2, my = (a[1] + b2[1]) / 2;
    const dx = mx - cx, dy = my - cy;
    const nr = Math.hypot(dx, dy) || 1;
    const lx = mx + (dx / nr) * 19, ly = my + (dy / nr) * 19;
    s += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="14" fill="#3f8f70"
        text-anchor="middle" dominant-baseline="central" font-weight="700">${i + 1}</text>`;
  }

  s += `<circle cx="${V[0][0].toFixed(1)}" cy="${V[0][1].toFixed(1)}" r="5.5" fill="#d94a4a"/>`;
  s += `<text x="${V[0][0].toFixed(1)}" y="${(V[0][1] + 18).toFixed(1)}" font-size="11"
      fill="#d94a4a" text-anchor="middle" font-weight="600">départ</text>`;
  return s + '</svg>';
}

function iconeForme(n, couleur) {
  // Meme silhouette que le croquis, en miniature
  const V = SILHOUETTES[n]
    .map(([x, y]) => `${(2 + x * 0.19).toFixed(1)},${(2 + (100 - y) * 0.17).toFixed(1)}`)
    .join(' ');
  return `<svg width="24" height="21" viewBox="0 0 24 21">
    <polygon points="${V}" fill="none" stroke="${couleur}" stroke-width="1.6"
      stroke-linejoin="round"/></svg>`;
}

// =====================================================================
// Rendu
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
const html = (s) => s;

function rendre() {
  document.documentElement.dataset.theme = S.theme === 'clair' ? 'clair' : 'sombre';
  document.body.style.fontSize = (15 * S.taille) + 'px';
  recalculer();

  $('#app').innerHTML = `
    ${barre()}
    ${S.page === 'accueil' ? accueil()
      : S.page === 'projets' ? pageProjets()
      : S.page === 'reglages' ? pageReglages()
      : pageApropos()}
  `;
}

function barre() {
  const onglet = (id, libelle) =>
    `<button data-page="${id}" class="${S.page === id ? 'actif' : ''}">${libelle}</button>`;
  return `<header class="barre">
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24">
        <rect x="4" y="3" width="4" height="18" rx="1" fill="#fff"/>
        <rect x="8" y="3" width="11" height="3.5" rx="1" fill="#fff"/>
        <rect x="5" y="8" width="2" height="1" fill="#2563c9"/>
        <rect x="5" y="11.5" width="2" height="1" fill="#2563c9"/>
        <rect x="5" y="15" width="2" height="1" fill="#2563c9"/>
      </svg>
    </div>
    <span class="marque">FASTCUT</span>
    <span class="sous-marque">Dessin de gabarits</span>
    <nav>
      ${onglet('accueil', 'Saisie')}
      ${onglet('projets', 'Projets')}
      ${onglet('reglages', 'Réglages')}
      ${onglet('apropos', 'À propos')}
    </nav>
  </header>`;
}

function accueil() {
  return `<div class="ecran">
    ${colonneFormes()}
    ${colonneCentre()}
    ${colonneSaisie()}
  </div>`;
}

function colonneFormes() {
  let s = `<div class="colonne col-formes"><p class="titre-section">Forme</p>`;
  for (let n = 3; n <= 8; n++) {
    const actif = n === S.nCotes;
    s += `<button class="forme ${actif ? 'actif' : ''}" data-forme="${n}">
      ${iconeForme(n, actif ? '#fff' : '#7d94ad')}<span>${n} côtés</span></button>`;
  }
  s += `<p class="titre-section" style="margin-top:16px">Commande (${S.commande.length})</p>`;
  if (!S.commande.length) {
    s += `<p style="font-size:12px;color:var(--texte2);margin:0">Aucun panneau.</p>`;
  } else {
    const surface = S.commande.reduce((t, p) => t + p.w * p.h, 0) / 1e6;
    S.commande.forEach((p, i) => {
      const err = p.erreur ?? 0;
      const pastille = err < 0.3 ? '#2b9e6b' : err < 1 ? '#c98a3a' : '#d94a4a';
      const encours = i === S.modifieIndex;
      s += `<div class="panneau-item" style="${encours ? 'outline:2px solid var(--bleu)' : ''}">
        <span class="panneau-ref">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;
            background:${pastille};margin-right:6px" title="écart ${err.toFixed(2)} mm"></span>
          ${echapper(p.ref)}</span>
        <span class="panneau-dim">${p.w} × ${p.h} mm${
          p.epaisseur ? ` · ${echapper(p.epaisseur)} mm` : ''}</span>
        ${p.note ? `<span class="panneau-dim" style="display:block">${echapper(p.note)}</span>` : ''}
        <div class="panneau-actions">
          <button data-modif="${i}">Modifier</button>
          <button data-dxf="${i}">DXF</button>
          <button data-suppr="${i}">Retirer</button>
        </div></div>`;
    });
    s += `<p style="font-size:11px;color:var(--texte2);margin:8px 0 4px">
      Surface totale : ${surface.toFixed(2)} m²</p>

function bandeauEtat() {
  const e = S.resultat.etat;

  if (e !== 'ok' && e !== 'ambigu') {
    const conf = {
      incomplet: ['#63768a', '·', 'Mesures incomplètes',
        'Renseigne tous les côtés et toutes les diagonales.'],
      incoherent: ['#d94a4a', '!', 'Mesures incohérentes',
        'Ces longueurs ne peuvent pas former une pièce fermée. Vérifie le relevé sur le gabarit.'],
    }[e];
    return `<div class="etat">
      <div class="pastille" style="background:${conf[0]}">${conf[1]}</div>
      <div><span class="etat-titre">${conf[2]}</span>
      <span class="etat-detail">${conf[3]}</span></div></div>`;
  }

  const forme = S.resultat.formes[S.choixForme] || S.resultat.formes[0];
  const err = forme.erreur;

  // Code couleur sur la tolerance : sur du verre, le millimetre compte
  const [couleur, symbole, qualite] =
    err < 0.3 ? ['#2b9e6b', '✓', 'relevé net']
    : err < 1.0 ? ['#c98a3a', '!', 'relevé approximatif']
    : ['#d94a4a', '!', 'écart important'];

  const titre = e === 'ambigu'
    ? 'Plusieurs formes possibles'
    : 'Forme calculée';
  const sousTitre = e === 'ambigu'
    ? 'Ces mesures décrivent plusieurs pièces — choisis celle du gabarit.'
    : `Écart max ${err.toFixed(2)} mm — ${qualite}`;

  let s = `<div class="etat">
    <div class="pastille" style="background:${e === 'ambigu' ? '#c98a3a' : couleur}"
      >${e === 'ambigu' ? '?' : symbole}</div>
    <div style="flex:1"><span class="etat-titre">${titre}</span>
    <span class="etat-detail">${sousTitre}</span></div>`;

  s += `<button class="mini-bouton" id="b-retourner"
      title="Si tu as relevé les côtés dans l'autre sens">Retourner</button>`;
  if (e === 'ok' && err >= 0.3)
    s += `<button class="mini-bouton" id="b-controle">Vérifier</button>`;
  s += `</div>`;

  // Controle croise : une mesure de verification a faire sur le gabarit
  if (S.controle) {
    s += `<div class="etat" style="border-left:3px solid var(--bleu)">
      <div style="flex:1">
        <span class="etat-titre">Mesure de contrôle</span>
        <span class="etat-detail">Sur le gabarit, la distance du coin
        ${S.controle.de + 1} au coin ${S.controle.vers + 1} doit faire
        <b style="color:var(--texte)">${Math.round(S.controle.longueur)} mm</b>.
        Un écart de plus de quelques millimètres signale une erreur de relevé.</span>
      </div>
      <button class="mini-bouton" id="b-controle-fermer">Fermer</button>
    </div>`;
  }
  return s;
}

      <input type="checkbox" id="o-rect" ${S.rectiligne.actif ? 'checked' : ''}>
      <span>Surplus rectiligne</span>

  S.arrondis.forEach((a, i) => {
    s += `<div class="option">

  s += `<button class="bouton b-neutre" id="b-arrondi" style="padding:8px;font-size:12px">

      Générer les DXF</button>`;

  return s + `</div>`;

function echapper(t) {
  return String(t ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// =====================================================================
// Modales
// =====================================================================
function modale(titre, texte, actions) {
  const voile = document.createElement('div');
  voile.className = 'voile';
  voile.innerHTML = `<div class="modale"><h2>${titre}</h2><p>${texte}</p>
    <div class="modale-actions">${actions.map((a, i) =>
      `<button class="bouton ${a.style || 'b-neutre'}" data-i="${i}">${a.libelle}</button>`).join('')}
    </div></div>`;
  document.body.appendChild(voile);
  voile.addEventListener('click', (e) => {
    const b = e.target.closest('[data-i]');
    if (b) {
      const a = actions[+b.dataset.i];
      voile.remove();
      a.action?.();
    } else if (e.target === voile) voile.remove();
  });
}

// Utilitaires

/** Reduit une photo avant stockage : sinon le navigateur sature vite. */
function reduireImage(dataUrl, maxCote = 900) {
  const img = new Image();
  img.onload = () => {
    const r = Math.min(1, maxCote / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    S.photo = c.toDataURL('image/jpeg', 0.72);
    rendre();
  };
  img.src = dataUrl;
  return dataUrl;
}

/** Affiche une proposition de forme en grand, pour choisir sans se tromper. */
function modaleForme(forme, index) {
  const voile = document.createElement('div');

  voile.innerHTML = `<div class="modale" style="max-width:640px">

      écart max ${forme.erreur.toFixed(2)} mm</p>

      <button class="bouton b-bleu" data-choisir>Choisir cette forme</button>
    </div></div>`;
  document.body.appendChild(voile);
  voile.addEventListener('click', (e) => {

    } else if (e.target.closest('[data-fermer]') || e.target === voile) voile.remove();
  });
}

// =====================================================================
// Actions
// =====================================================================
function ajouterPanneau() {
  const ref = S.reference.trim();
  if (!ref) return modale('Référence manquante',
    'Donne une référence au panneau, elle servira de nom de fichier.',
    [{ libelle: 'Compris' }]);

  const doublon = S.commande.some((p, i) => p.ref === ref && i !== S.modifieIndex);
  if (doublon) return modale('Référence déjà prise',
    `Un panneau « ${echapper(ref)} » existe déjà dans la commande.`,
    [{ libelle: 'Compris' }]);

  if (S.resultat.etat === 'incomplet') return modale('Mesures incomplètes',
    'Renseigne tous les côtés et toutes les diagonales.', [{ libelle: 'Compris' }]);
  if (S.resultat.etat === 'incoherent') return modale('Mesures incohérentes',
    'Ces longueurs ne forment pas une pièce fermée. Vérifie le relevé sur le gabarit.',
    [{ libelle: 'Compris' }]);

  const g = contourCourant();
  const { w, h } = dimensionsPanneau(g);
  const panneau = {
    ref, nCotes: S.nCotes, valeurs: { ...S.valeurs },
    arrondis: S.arrondis.map((a) => ({ ...a })),
    marge: { ...S.marge }, rectiligne: { ...S.rectiligne },
    choixForme: S.choixForme, w, h,
    epaisseur: S.epaisseur, note: S.note, photo: S.photo,
    erreur: S.resultat.formes[S.choixForme]?.erreur ?? 0,
  };

  if (S.modifieIndex !== null) {
    S.commande[S.modifieIndex] = panneau;
    S.modifieIndex = null;
  } else {
    S.commande.push(panneau);
  }

  viderSaisie();
  sauverBrouillon();
  rendre();
}

function viderSaisie() {
  S.reference = ''; S.note = ''; S.photo = null; S.controle = null;
}

function modifierPanneau(i) {
  const p = S.commande[i];
  S.modifieIndex = i;
  S.nCotes = p.nCotes;
  S.valeurs = { ...p.valeurs };
  S.arrondis = (p.arrondis || []).map((a) => ({ ...a }));
  S.marge = { ...p.marge };
  S.rectiligne = { ...p.rectiligne };
  S.choixForme = p.choixForme || 0;
  S.reference = p.ref;
  S.epaisseur = p.epaisseur || '';
  S.note = p.note || '';
  S.photo = p.photo || null;
  S.page = 'accueil';
  rendre();
}

function geometriePanneau(p) {
  const res = calculerFormes(p.nCotes, p.valeurs);
  const pts = res.formes[p.choixForme]?.points || res.formes[0]?.points;
  if (!pts) return null;
  return contourCourant({
    pointsBruts: pts, arrondis: p.arrondis,
    marge: p.marge, rectiligne: p.rectiligne
  });
}

function exporterUn(i) {
  const p = S.commande[i];
  const g = geometriePanneau(p);
  if (!g) return modale('Export impossible',
    'Ce panneau ne peut pas être recalculé. Vérifie ses cotes.', [{ libelle: 'Compris' }]);
  const date = new Date().toISOString().slice(0, 10);
  telechargerDXF(construireDXF(g.contour, g.rect, p.ref, S.projet, date), `${p.ref}.dxf`);
}

function validerProjet() {
  if (!S.projet.trim()) return modale('Nom de projet manquant',
    'Donne un nom au projet avant de générer les fichiers.', [{ libelle: 'Compris' }]);

  const surface = S.commande.reduce((t, p) => t + p.w * p.h, 0) / 1e6;
  modale('Générer les DXF',
    `Projet « ${echapper(S.projet)} » · ${S.commande.length} panneau${S.commande.length > 1 ? 'x' : ''}
     · ${surface.toFixed(2)} m²<br><br>
     Un fichier DXF sera téléchargé par panneau.`,
    [
      { libelle: 'Annuler' },
      { libelle: 'Générer', style: 'b-bleu', action: genererTout },
    ]);
}

function genererTout() {
  const date = new Date().toISOString().slice(0, 10);
  let ok = 0;
  const echecs = [];
  S.commande.forEach((p, i) => {
    const g = geometriePanneau(p);
    if (!g) { echecs.push(p.ref); return; }
    setTimeout(() => {
      telechargerDXF(construireDXF(g.contour, g.rect, p.ref, S.projet, date), `${p.ref}.dxf`);
    }, i * 260);
    ok++;
  });

  const projets = stockage.lire('fc_projets', {});
  projets[S.projet.trim()] = { date, panneaux: S.commande };
  stockage.ecrire('fc_projets', projets);

  setTimeout(() => {
    modale('DXF générés',
      `${ok} fichier${ok > 1 ? 's' : ''} téléchargé${ok > 1 ? 's' : ''}.` +
      (echecs.length ? `<br><br>Échec : ${echecs.join(', ')}` : '') +
      `<br><br>Le projet est enregistré, tu peux le rouvrir depuis l'onglet Projets.`,
      [{ libelle: 'Terminé', style: 'b-bleu' }]);
  }, S.commande.length * 260 + 200);
}

function genererFiche() {
  const dessin = (p) => {
    const g = geometriePanneau(p);
    return g ? svgForme(g.contour, g.rect, { cotes: true }) : '';
  };
  const ok = ouvrirFicheDecoupe(S.projet || 'Sans titre', S.commande, dessin);
  if (!ok) modale('Fenêtre bloquée',
    "Le navigateur a bloqué l'ouverture de la fiche. Autorise les fenêtres " +
    "pop-up pour ce site, puis réessaie.", [{ libelle: 'Compris' }]);
}

function genererCSV() {
  const nom = (S.projet || 'commande').replace(/[^\w-]/g, '_');
  telechargerTexte(construireCSV(S.projet || '', S.commande), `${nom}.csv`);
}

function sauvegarderProjets() {
  const projets = stockage.lire('fc_projets', {});
  const n = Object.keys(projets).length;
  if (!n) return modale('Aucun projet',
    "Il n'y a encore aucun projet enregistré à sauvegarder.", [{ libelle: 'Compris' }]);
  const date = new Date().toISOString().slice(0, 10);
  telechargerTexte(exporterSauvegarde(projets),
    `fastcut-sauvegarde-${date}.json`, 'application/json');
}

function restaurerProjets(texte) {
  const projets = lireSauvegarde(texte);
  if (!projets) return modale('Fichier non reconnu',
    "Ce fichier n'est pas une sauvegarde FASTCUT.", [{ libelle: 'Compris' }]);
  const actuels = stockage.lire('fc_projets', {});
  const fusion = { ...actuels, ...projets };
  stockage.ecrire('fc_projets', fusion);
  modale('Sauvegarde restaurée',
    `${Object.keys(projets).length} projet(s) importé(s).`,
    [{ libelle: 'Terminé', style: 'b-bleu', action: rendre }]);
}

function ouvrirProjet(nom) {
  const projets = stockage.lire('fc_projets', {});
  const p = projets[nom];
  if (!p) return;
  const charger = () => {
    S.projet = nom;
    S.commande = p.panneaux;
    S.page = 'accueil';
    sauverBrouillon();
    rendre();
  };
  if (S.commande.length) {
    modale('Ouvrir le projet',
      `La commande en cours (${S.commande.length} panneaux) sera remplacée.`,
      [{ libelle: 'Annuler' }, { libelle: 'Ouvrir', style: 'b-bleu', action: charger }]);
  } else charger();
}

// =====================================================================
// Evenements
// =====================================================================
function brancher() {
  const app = $('#app');

  app.addEventListener('click', (e) => {
    const t = e.target;
    const page = t.closest('[data-page]');
    if (page) { S.page = page.dataset.page; return rendre(); }

    const forme = t.closest('[data-forme]');
    if (forme) {
      S.nCotes = +forme.dataset.forme;
      S.valeurs = {}; S.arrondis = []; S.choixForme = 0;
      return rendre();
    }

    const onglet = t.closest('[data-onglet]');
    if (onglet) { S.ongletDessin = onglet.dataset.onglet; return rendre(); }

    const agrandir = t.closest('[data-agrandir]');
    if (agrandir) {
      const i = +agrandir.dataset.agrandir;
      const f = S.resultat.formes[i];
      if (f) modaleForme(f, i);
      return;
    }

    const choix = t.closest('[data-choix]');
    if (choix) { S.choixForme = +choix.dataset.choix; return rendre(); }

    const dxf = t.closest('[data-dxf]');
    if (dxf) return exporterUn(+dxf.dataset.dxf);

    const modif = t.closest('[data-modif]');
    if (modif) return modifierPanneau(+modif.dataset.modif);

    if (t.closest('#b-annuler-modif')) {
      S.modifieIndex = null; viderSaisie(); return rendre();
    }
    if (t.closest('#b-photo-suppr')) { S.photo = null; return rendre(); }
    if (t.closest('#b-retourner')) {
      const f = S.resultat.formes[S.choixForme];
      if (f) { f.points = retournerForme(f.points); S.pointsBruts = f.points; }
      return rendre();
    }

    const suppr = t.closest('[data-suppr]');
    if (suppr) {
      const i = +suppr.dataset.suppr;
      return modale('Retirer le panneau',
        `Retirer « ${echapper(S.commande[i].ref)} » de la commande ?`,
        [{ libelle: 'Annuler' }, {
          libelle: 'Retirer', style: 'b-orange',
          action: () => { S.commande.splice(i, 1); sauverBrouillon(); rendre(); }
        }]);
    }

    const arrSuppr = t.closest('[data-arr-suppr]');
    if (arrSuppr) { S.arrondis.splice(+arrSuppr.dataset.arrSuppr, 1); return rendre(); }

    const ouvrir = t.closest('[data-ouvrir]');
    if (ouvrir) return ouvrirProjet(ouvrir.dataset.ouvrir);

    const taille = t.closest('[data-taille]');
    if (taille) {
      S.taille = +taille.dataset.taille;
      localStorage.setItem('fc_taille', S.taille);
      return rendre();
    }

    if (t.closest('#b-theme')) {
      S.theme = S.theme === 'sombre' ? 'clair' : 'sombre';
      localStorage.setItem('fc_theme', S.theme);
      return rendre();
    }
    if (t.closest('#b-controle')) {
      const f = S.resultat.formes[S.choixForme] || S.resultat.formes[0];
      S.controle = f ? mesureDeControle(f.points) : null;
      return rendre();
    }
    if (t.closest('#b-controle-fermer')) { S.controle = null; return rendre(); }
    if (t.closest('#b-arrondi')) {
      S.arrondis.push({ coin: 0, rayon: 50 });
      return rendre();
    }
    if (t.closest('#b-fiche')) return genererFiche();
    if (t.closest('#b-csv')) return genererCSV();
    if (t.closest('#b-sauvegarde')) return sauvegarderProjets();
    if (t.closest('#b-ajouter')) return ajouterPanneau();
    if (t.closest('#b-valider')) return validerProjet();
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.cle) {
      S.valeurs[t.dataset.cle] = t.value;
      return majDessin();
    }
    if (t.id === 'i-projet') { S.projet = t.value; return sauverBrouillon(); }
    if (t.id === 'i-ref') { S.reference = t.value; return; }
    if (t.id === 'i-epaisseur') { S.epaisseur = t.value; return; }
    if (t.id === 'i-note') { S.note = t.value; return; }
    if (t.id === 'v-marge') { S.marge.valeur = parseFloat(t.value) || 0; return majDessin(); }
    if (t.id === 'v-rect') { S.rectiligne.valeur = parseFloat(t.value) || 0; return majDessin(); }
    if (t.dataset.arrCoin !== undefined) {
      const i = +t.dataset.arrCoin;
      S.arrondis[i].coin = Math.max(0, Math.min(S.nCotes - 1, (parseInt(t.value) || 1) - 1));
      return majDessin();
    }
    if (t.dataset.arrRayon !== undefined) {
      S.arrondis[+t.dataset.arrRayon].rayon = parseFloat(t.value) || 0;
      return majDessin();
    }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'i-restaurer' && t.files?.[0]) {
      const lect = new FileReader();
      lect.onload = () => restaurerProjets(lect.result);
      lect.readAsText(t.files[0]);
      return;
    }
    if (t.id === 'i-photo' && t.files?.[0]) {
      const lecteur = new FileReader();
      lecteur.onload = () => { S.photo = reduireImage(lecteur.result); };
      lecteur.readAsDataURL(t.files[0]);
      return;
    }
    if (t.id === 'o-marge') { S.marge.actif = t.checked; return majDessin(); }
    if (t.id === 'o-rect') { S.rectiligne.actif = t.checked; return majDessin(); }
  });

  // Entree = champ suivant
  app.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const champs = [...app.querySelectorAll('[data-cle]')];
    const i = champs.indexOf(e.target);
    if (i >= 0 && i < champs.length - 1) { e.preventDefault(); champs[i + 1].focus(); }
  });
}

/** Met a jour le dessin sans reconstruire toute la page (garde le focus). */
function majDessin() {
  recalculer();
  const centre = $('.col-centre');
  if (!centre) return;
  const memeEtat = centre.dataset.etat === S.resultat.etat;
  centre.outerHTML = colonneCentre();
  $('.col-centre').dataset.etat = S.resultat.etat;
}

brancher();
rendre();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
